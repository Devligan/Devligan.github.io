# Rebuilds the portfolio from live GitHub data and deploys it to GitHub Pages.
# Runs on every push, every hour, and on demand (Actions tab → Run workflow).

name: Sync & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write # commit the refreshed data snapshot
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Sync from GitHub
        run: npm run sync
        env:
          # The built-in token can read public data. To have the activity
          # calendar include private contributions, add a fine-grained PAT
          # as the PORTFOLIO_TOKEN secret.
          GITHUB_TOKEN: ${{ secrets.PORTFOLIO_TOKEN || secrets.GITHUB_TOKEN }}

      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      # Keeping the snapshot in git means local dev works offline, history
      # shows how the profile grew, and the repo stays "active" so GitHub
      # never pauses the hourly schedule.
      - name: Commit refreshed snapshot
        run: |
          git config user.name "portfolio-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/github.json public/quest-art
          # Only commit when something real changed, not just the timestamp.
          if git diff --cached --name-only | grep -q quest-art \
            || git diff --cached -U0 | grep -E '^[+-][^+-]' | grep -qv '"generatedAt"'; then
            git commit -m "Sync from GitHub" && git push
          else
            echo "Nothing new on GitHub."
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
